


spring.application.name=corso2spring



# File txt dove i conti vengono salvati e intervallo di salvataggio (ms)
conti.file=conti.txt
conti.salvataggio-ms=10000


# Database H2 in memoria: i dati si perdono al riavvio
spring.datasource.url=jdbc:h2:mem:agenziaviaggi
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Swagger UI: /swagger-ui.html - documento JSON: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
